<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="site-title">Student Portal</h1>
        <nav>
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#courses">Courses</a></li>
                <li><a href="#profile">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h2>Welcome to the Student Portal</h2>
            <p>Browse your enrolled courses and track academic progress.</p>
        </section>
        <section id="courses">
            <h2>My Courses</h2>
            <div class="controls">
                <input type="text" id="search-courses" placeholder="Search courses...">
                <button id="sort-credits">Sort by Credits</button>
            </div>
            <p id="results-count" role="status" aria-live="polite"></p>
            <div class="course-grid"></div>
            <p id="total-credits"></p>
            <div id="selected-course"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>
    <script type="module" src="app.js"></script>
</body>
</html>
